# Beispiel für nginx vor der Web-Version (HTTPS z. B. mit certbot). Nach /etc/nginx/sites-available/ kopieren,
# Domain anpassen, verlinken, „sudo nginx -t && sudo systemctl reload nginx“.
# Nur über HTTPS – Port 80 leitet um
server {
    listen 80;
    server_name posting.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name posting.example.de;
    # ssl_certificate /etc/letsencrypt/live/posting.example.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/posting.example.de/privkey.pem;

    # Videos hochladen: so groß wie WEB_MAX_MB, direkt durchreichen statt zwischenspeichern
    client_max_body_size 500m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Echte Adresse der Besucher – für die Begrenzungen (Anmeldeversuche, Uploads)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
